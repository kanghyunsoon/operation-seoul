spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

ai.provider=${AI_PROVIDER:openai}
openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4.1-mini}
gemini.api.key=${GEMINI_API_KEY:}
episode.migration.legacy-place-hints.enabled=${LEGACY_PLACE_HINT_MIGRATION_ENABLED:false}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash-lite}
google.vision.key=${GOOGLE_VISION_KEY}
tourapi.key=${TOURAPI_SERVICE_KEY}
kakao.rest.api.key=${KAKAO_REST_API_KEY}
oauth.google.client-id=${GOOGLE_OAUTH_CLIENT_ID}
oauth.kakao.client-id=${KAKAO_OAUTH_CLIENT_ID:${kakao.rest.api.key}}
oauth.kakao.client-secret=${KAKAO_OAUTH_CLIENT_SECRET:}
oauth.kakao.redirect-uri=${KAKAO_OAUTH_REDIRECT_URI}
tmap.app.key=${TMAP_APP_KEY:}
external.research.wikipedia.enabled=${EXTERNAL_RESEARCH_WIKIPEDIA_ENABLED:true}
external.research.wikipedia.endpoint=${EXTERNAL_RESEARCH_WIKIPEDIA_ENDPOINT:https://ko.wikipedia.org/w/api.php}

jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER:operation-korea}
jwt.validity-ms=${JWT_VALIDITY_MS:7200000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.dev-mode.arrival-enabled=false
app.puzzle.attempt-limit=${PUZZLE_ATTEMPT_LIMIT:8}
app.puzzle.attempt-window-seconds=${PUZZLE_ATTEMPT_WINDOW_SECONDS:600}
app.puzzle.cleanup-initial-delay-ms=${PUZZLE_CLEANUP_INITIAL_DELAY_MS:60000}
app.puzzle.cleanup-interval-ms=${PUZZLE_CLEANUP_INTERVAL_MS:3600000}

server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.tomcat.connection-timeout=10s
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=1MB
server.compression.enabled=true
server.compression.min-response-size=2KB

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:3000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
spring.jpa.show-sql=false
logging.level.root=INFO
logging.level.com.operation.seoul=INFO
