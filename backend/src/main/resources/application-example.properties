# Copy variable names into your shell or deployment platform.
# Do not paste real secrets into committed property files.

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/operation_seoul}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
mybatis.configuration.map-underscore-to-camel-case=true

ai.provider=${AI_PROVIDER:openai}
openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4.1-mini}
gemini.api.key=${GEMINI_API_KEY:}
episode.migration.legacy-place-hints.enabled=${LEGACY_PLACE_HINT_MIGRATION_ENABLED:false}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash-lite}
google.vision.key=${GOOGLE_VISION_KEY:}
tourapi.key=${TOURAPI_SERVICE_KEY:}
kakao.rest.api.key=${KAKAO_REST_API_KEY:}
tmap.app.key=${TMAP_APP_KEY:}
external.research.wikipedia.enabled=${EXTERNAL_RESEARCH_WIKIPEDIA_ENABLED:true}
external.research.wikipedia.endpoint=${EXTERNAL_RESEARCH_WIKIPEDIA_ENDPOINT:https://ko.wikipedia.org/w/api.php}

jwt.secret=${JWT_SECRET:operation-seoul-local-development-jwt-secret}
jwt.issuer=${JWT_ISSUER:operation-seoul-local}
jwt.validity-ms=${JWT_VALIDITY_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.dev-mode.arrival-enabled=${DEV_ARRIVAL_ENABLED:false}
app.puzzle.attempt-limit=${PUZZLE_ATTEMPT_LIMIT:8}
app.puzzle.attempt-window-seconds=${PUZZLE_ATTEMPT_WINDOW_SECONDS:600}
app.puzzle.cleanup-initial-delay-ms=${PUZZLE_CLEANUP_INITIAL_DELAY_MS:60000}
app.puzzle.cleanup-interval-ms=${PUZZLE_CLEANUP_INTERVAL_MS:3600000}

# Deployment health endpoints:
# /actuator/health/liveness
# /actuator/health/readiness
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
